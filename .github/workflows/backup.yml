name: Backup diario de la base de datos

# Se ejecuta solo (todos los días) y también se puede lanzar a mano desde
# la pestaña "Actions" del repositorio en GitHub (botón "Run workflow").
#
# El volcado se guarda como "artifact" de esta ejecución (Actions → esta
# ejecución → Artifacts, al final de la página), NO se commitea al
# repositorio: la base de datos guarda credenciales propias (clave de
# Resend, token del anfitrión) que nunca deben quedar en el historial de
# git, así que se excluyen del volcado y además éste se mantiene fuera de
# git por completo.
on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC ≈ 05:00/06:00 hora Canarias
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Exportar la base de datos de Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Falta el secreto SUPABASE_DB_URL en la configuración del repositorio." >&2
            exit 1
          fi
          mkdir -p backups
          docker run --rm postgres:17 pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges \
            --exclude-table-data='public.config_secretos' \
            --exclude-table-data='public.anfitrion_secreto' \
            > "backups/backup-$(date -u +%F).sql"

      - name: Adjuntar el backup a esta ejecución
        uses: actions/upload-artifact@v4
        with:
          name: backup-base-de-datos
          path: backups/*.sql
          retention-days: 90
