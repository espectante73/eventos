<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Evita que Safari "detecte" las horas del cronograma (18:00,
         21:15...) como fechas y les añada su propio menú emergente
         (Crear evento, Crear recordatorio...) encima de los campos de
         edición -- a petición del usuario, 2026-08-27. No he podido
         verlo yo mismo en un navegador real; confirmar tras probarlo. -->
    <meta name="format-detection" content="date=no, telephone=no, address=no, email=no" />
    <title>Libro de invitados</title>
    <!-- Miniatura al compartir cualquier enlace de esta web en WhatsApp/
         Facebook (og:image) -- a petición del usuario, 2026-08-25.
         ESTÁTICO a propósito: el rastreador que genera la vista previa
         lee este HTML tal cual, sin ejecutar React, así que no puede
         depender de datos de la base (evento.imagen, que además es un
         data: URI, no una URL http válida para esto). La imagen de
         verdad vive en Supabase Storage con un nombre de archivo fijo
         (ver VentanaConfigDatosEvento.jsx / schema.sql) -- se sube desde
         Configuración → Datos del evento, y como la URL nunca cambia,
         no hace falta tocar este archivo cada vez que se reemplaza la
         foto. "%VITE_SUPABASE_URL%" lo rellena Vite solo, en el build,
         con el valor real de tu .env/Vercel -- no hay ninguna URL fija
         de un proyecto de Supabase concreto escrita aquí a mano, para
         que esta plantilla se pueda reutilizar en un evento futuro sin
         tocar este archivo. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Toda la información del evento" />
    <meta property="og:description" content="Fecha, hora, lugar y novedades." />
    <meta property="og:image" content="%VITE_SUPABASE_URL%/storage/v1/object/public/og-imagen/portada.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Cloudflare Turnstile (CAPTCHA del login) -- Fase D, 2026-08-24.
         Se carga aquí (no como import de npm) porque el widget vive
         fuera del árbol de React: VistaLogin.jsx llama a
         window.turnstile.render(...) directamente. async+defer para no
         bloquear el arranque de la app si el script tarda o falla. -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
